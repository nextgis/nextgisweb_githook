- id: ruff-check
  name: ruff-check
  language: system
  entry: ruff check --force-exclude
  types_or: [python, pyi]
  require_serial: true

- id: ruff-format
  name: ruff-format
  language: system
  entry: ruff format --force-exclude
  types_or: [python, pyi]
  require_serial: true

- id: eslint
  name: eslint
  language: system
  entry: npx eslint --max-warnings 1
  types: [file]
  files: \.[jt]sx?$
  require_serial: true

- id: prettier
  name: prettier
  language: system
  entry: npx prettier --check
  types: [file]
  files: \.(css|less|md)$
  require_serial: true
